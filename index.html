    function applyCalibrationQueryPreset() {
      const params = new URLSearchParams(window.location.search);
      const moduleId = params.get("module");
      const stage = params.get("stage");
      const ref = params.get("ref");
      const opacity = params.get("opacity");
      const preview = params.get("preview");
      const mode = params.get("mode");
      const calibration = params.get("calibration");
      const debug = params.get("debug");
      const calibrationRequested = calibration === "1" || calibration === "true";
      const debugRequested = debug === "solver" || debug === "1" || debug === "true";
      const stageRequested = ["reference", "points", "bboxes", "wires", "all"].includes(stage);
      const referenceRequested = ref !== null || opacity !== null;
      const previewRequested = Boolean(preview && simPreviewPresets[preview]);

      if (calibrationRequested || stageRequested || referenceRequested || previewRequested) {
        state.calibration.enabled = true;
        state.debug.developerTools = true;
      }

      if (debugRequested) {
        state.debug.developerTools = true;
      }

      if (moduleId && moduleCatalog[moduleId]) {
        uiState.currentModule = moduleId;
      }

      if (stageRequested) {
        setCalibrationStage(stage);
      }

      if (opacity !== null) {
        const parsedOpacity = Number(opacity);
        if (!Number.isNaN(parsedOpacity)) {
          state.calibration.referenceOpacity = Math.max(0, Math.min(1, parsedOpacity));
        }
      }

      if (ref === "0") {
        state.calibration.showReference = false;
      } else if (ref === "1") {
        state.calibration.showReference = true;
      } else if (opacity !== null) {
        state.calibration.showReference = state.calibration.referenceOpacity > 0;
      }

      if (preview && simPreviewPresets[preview]) {
        setSimulationPreviewPreset(preview);
      }

      if (mode === "solver") {
        setSimulationMode("solver");
      }

      if (debugRequested) {
        setSolverDebugVisible(true);
      }
    }

      const messages = {
        stopped: "电机当前停止。未运行时不显示主回路流光，但 U3/V3/W3 三相接入结构保持可见。",
        forward: "电机当前正转，主回路保持 L1->U3、L2->V3、L3->W3 的相序关系。",
        reverse: "电机当前反转，主回路换相后形成 L1->W3、L2->V3、L3->U3 的相序关系。",
        fault: "电机当前因 FR1 过载动作而故障停止。"
      };
      setInfo("motor", messages[state.motorState]);
      render();
    });
    refs.boardSb1.addEventListener("click", handlePrimaryPlatformAction);
    refs.boardSb2.addEventListener("click", handleSecondaryPlatformAction);
    refs.boardSb3.addEventListener("click", handleTertiaryPlatformAction);
    refs.simulationComponentLayer.addEventListener("click", (event) => {
      if (!isContinuousControlModule()) return;
      const piece = event.target.closest?.("[data-sim-piece]");
      if (!piece) return;
      const actionByPiece = {
        cmp_cont_sb1: "START_PRIMARY_PRESS",
        cmp_cont_sb2: "STOP_PRIMARY_PRESS",
        cmp_cont_fr1_main: "PROTECTION_TOGGLE",
        cmp_cont_fr1_nc: "PROTECTION_TOGGLE"
      };
      const actionType = piece.dataset.simPiece === "cmp_cont_qf1"
        ? isCurrentQfClosed() ? "POWER_OPEN" : "POWER_CLOSE"
        : actionByPiece[piece.dataset.simPiece];
      if (!actionType) return;
      dispatchCurrentFacadeAction(actionType, {}, "continuous-canvas");
      event.preventDefault();
    });
    refs.simulationComponentLayer.addEventListener("pointerdown", (event) => {
      const piece = event.target.closest?.('[data-sim-piece="cmp_jog_sb"]');
      if (!piece) return;
      if (!dispatchCurrentFacadeControl("secondary", "press", { reason: "canvas pointerdown" })) return;
      event.preventDefault();
    });
    document.addEventListener("pointerup", () => {
      dispatchCurrentFacadeControl("secondary", "release", { reason: "document pointerup" });
    });
    document.addEventListener("pointercancel", () => {
      dispatchCurrentFacadeControl("secondary", "release", { reason: "document pointercancel" });
    });
    window.addEventListener("blur", () => {
      dispatchCurrentFacadeControl("secondary", "release", { reason: "window blur release" });
    });
    refs.navItems.forEach((button) => {
      button.addEventListener("click", () => switchModule(button.dataset.module));
    });
    document.addEventListener("mousedown", suppressMiddleClickAutoScroll, { passive: false });
    document.addEventListener("auxclick", suppressMiddleClickAutoScroll, { passive: false });

    window.calibrationApi = {
      switchModule,
      setStage: (stage) => {
        setCalibrationStage(stage);
        render();
      },
      setReferenceVisible: (visible) => {
        state.calibration.showReference = Boolean(visible);
        render();
      },
      setReferenceOpacity: (opacity) => {
        setCalibrationReferenceOpacity(opacity);
        render();
      },
      setPreviewPreset: (preset) => {
        setSimulationMode("preview");
        setSimulationPreviewPreset(preset);
        render();
      },
      setSimulationMode: (mode) => {
        setSimulationMode(mode);
        render();
      },
      setSolverDebugVisible: (visible) => {
        setSolverDebugVisible(visible);
        render();
      },
      getCounts: () => (isMainControlModule()
        ? validateMainControlGeometryData()
        : isContinuousControlModule()
          ? validateContinuousControlGeometryData()
          : isJogControlModule()
            ? validateJogControlGeometryData()
            : validateCalibrationData()).counts,
      getValidationReport: () => (isMainControlModule()
        ? validateMainControlGeometryData()
        : isContinuousControlModule()
          ? validateContinuousControlGeometryData()
          : isJogControlModule()
            ? validateJogControlGeometryData()
            : validateCalibrationData()),
      getSimulationPreviewReport: () => ({
        preset: (isMainControlModule() || isContinuousControlModule() || isJogControlModule()) ? null : state.simPreview.preset,
        simComponentCount: isMainControlModule()
          ? mainControlComponentBBoxes.length
          : isContinuousControlModule()
            ? continuousControlComponentBBoxes.length
          : isJogControlModule()
            ? jogControlComponentBBoxes.length
            : SIM_COMPONENT_COUNT,
        geometryLockId: isMainControlModule()
          ? MAIN_CONTROL_GEOMETRY_LOCK_ID
          : isContinuousControlModule()
            ? CONTINUOUS_CONTROL_GEOMETRY_LOCK_ID
          : isJogControlModule()
            ? JOG_CONTROL_GEOMETRY_LOCK_ID
            : FORWARD_REVERSE_GEOMETRY_LOCK_ID,
        geometryLocked: true,
        previewState: (isMainControlModule() || isContinuousControlModule() || isJogControlModule()) ? null : getSimulationPreviewState(),
        validation: isMainControlModule()
          ? validateMainControlGeometryData()
          : isContinuousControlModule()
            ? validateContinuousControlGeometryData()
          : isJogControlModule()
            ? validateJogControlGeometryData()
            : validateCalibrationData()
      })
    };

    window.solverApi = {
      setMode: (mode) => {
        setSimulationMode(mode);
        render();
      },
      setDebugVisible: (visible) => {
        setSolverDebugVisible(visible);
        render();
      },
      getViewportReport: () => JSON.parse(JSON.stringify(state.viewport)),
      getLabelOverlapReport: () => JSON.parse(JSON.stringify(state.labelAudit)),
      reset: () => {
        resetAll();
      },
      setOperationState: (patch) => {
        if (isContinuousControlModule()) {
          setContinuousControlOperationState(patch, "solverApi patch");
        } else if (isMainControlModule()) {
          setMainControlOperationState(patch, "solverApi patch");
        } else if (isJogControlModule()) {
          setJogControlOperationState(patch, "solverApi patch");
        } else {
          setSolverOperationState(patch, "solverApi patch");
        }
        render();
      },
      pressButton: (buttonId) => {
        const allowedButtons = isContinuousControlModule()
          ? ["sb1", "sb2"]
          : isMainControlModule()
          ? ["sb1", "sb2", "sb3", "sb4"]
          : isJogControlModule()
            ? ["sb"]
            : ["sb1", "sb2", "sb3"];
        if (!allowedButtons.includes(buttonId)) return;
        setSimulationMode("solver");
        if (isContinuousControlModule()) {
          state.continuousControl.operationState[buttonId] = "pressed";
          recomputeContinuousControlSolver(`solverApi ${buttonId} press`);
        } else if (isMainControlModule()) {
          state.mainControl.operationState[buttonId] = "pressed";
          recomputeMainControlSolver(`solverApi ${buttonId} press`);
        } else if (isJogControlModule()) {
          state.jogControl.operationState.sb = "pressed";
          recomputeJogControlSolver(`solverApi ${buttonId} press`);
        } else {
          state.operationState[buttonId] = "pressed";
          recomputeElectricalSolver(`solverApi ${buttonId} press`);
        }
        render();
      },
      releaseButton: (buttonId) => {
        const allowedButtons = isContinuousControlModule()
          ? ["sb1", "sb2"]
          : isMainControlModule()
          ? ["sb1", "sb2", "sb3", "sb4"]
          : isJogControlModule()
            ? ["sb"]
            : ["sb1", "sb2", "sb3"];
        if (!allowedButtons.includes(buttonId)) return;
        setSimulationMode("solver");
        if (isContinuousControlModule()) {
          state.continuousControl.operationState[buttonId] = "released";
          recomputeContinuousControlSolver(`solverApi ${buttonId} release`);
        } else if (isMainControlModule()) {
          state.mainControl.operationState[buttonId] = "released";
          recomputeMainControlSolver(`solverApi ${buttonId} release`);
        } else if (isJogControlModule()) {
          state.jogControl.operationState.sb = "released";
          recomputeJogControlSolver(`solverApi ${buttonId} release`);
        } else {
          state.operationState[buttonId] = "released";
          recomputeElectricalSolver(`solverApi ${buttonId} release`);
        }
        render();
      },
      getState: () => {
        const solverState = isContinuousControlModule()
          ? {
            stableControlState: state.continuousControl.stableControlState,
            iterationCount: state.continuousControl.solver.iterationCount,
            activeControlWireIds: state.continuousControl.solver.activeControlWireIds,
            activeMainWireIds: state.continuousControl.solver.activeMainWireIds,
            partialControlWireIds: state.continuousControl.solver.partialControlWireIds,
            activeControlEdgeIds: state.continuousControl.solver.activeControlEdgeIds,
            activeMainEdgeIds: state.continuousControl.solver.activeMainEdgeIds,
            motorRunning: state.continuousControl.solver.motorRunning,
            selfHoldConductive: state.continuousControl.solver.selfHoldConductive,
            controlSupplyBoundary: state.continuousControl.solver.controlSupplyBoundary,
            converged: state.continuousControl.solver.converged,
            lastAction: state.continuousControl.solver.lastAction,
            testReport: state.continuousControl.solver.testReport
          }
          : isMainControlModule()
          ? {
            stableControlState: state.mainControl.stableControlState,
            iterationCount: state.mainControl.solver.iterationCount,
            activeControlWireIds: state.mainControl.solver.activeControlWireIds,
            activeMainWireIds: state.mainControl.solver.activeMainWireIds,
            partialControlWireIds: state.mainControl.solver.partialControlWireIds,
            activeControlEdgeIds: state.mainControl.solver.activeControlEdgeIds,
            activeMainEdgeIds: state.mainControl.solver.activeMainEdgeIds,
            motorStates: state.mainControl.solver.motorStates,
            controlSupplyBoundary: state.mainControl.solver.controlSupplyBoundary,
            converged: state.mainControl.solver.converged,
            lastAction: state.mainControl.solver.lastAction,
            testReport: state.mainControl.solver.testReport
          }
          : isJogControlModule()
            ? {
              stableControlState: state.jogControl.stableControlState,
              iterationCount: state.jogControl.solver.iterationCount,
              activeControlWireIds: state.jogControl.solver.activeControlWireIds,
              activeMainWireIds: state.jogControl.solver.activeMainWireIds,
              partialControlWireIds: state.jogControl.solver.partialControlWireIds,
              activeControlEdgeIds: state.jogControl.solver.activeControlEdgeIds,
              activeMainEdgeIds: state.jogControl.solver.activeMainEdgeIds,
              motorRunning: state.jogControl.solver.motorRunning,
              controlSupplyBoundary: state.jogControl.solver.controlSupplyBoundary,
              converged: state.jogControl.solver.converged,
              lastAction: state.jogControl.solver.lastAction,
              testReport: state.jogControl.solver.testReport
            }
          : {
            stableControlState: state.solver.stableControlState,
            iterationCount: state.solver.iterationCount,
            activeControlWireIds: state.solver.activeControlWireIds,
            activeMainWireIds: state.solver.activeMainWireIds,
            activeControlEdgeIds: state.solver.activeControlEdgeIds,
            activeMainEdgeIds: state.solver.activeMainEdgeIds,
            activeMainWirePhaseMap: state.solver.activeMainWirePhaseMap,
            motorPhases: state.solver.motorPhases,
            motorState: state.solver.motorState,
            converged: state.solver.converged,
            lastAction: state.solver.lastAction,
            testReport: state.solver.testReport
          };

        return {
          moduleId: uiState.currentModule,
          operationState: isContinuousControlModule()
            ? cloneContinuousControlOperationState()
            : isMainControlModule()
            ? cloneMainControlOperationState()
            : isJogControlModule()
              ? cloneJogControlOperationState()
              : cloneOperationState(),
          solver: JSON.parse(JSON.stringify(solverState)),
          viewport: JSON.parse(JSON.stringify(state.viewport)),
          currentFlow: JSON.parse(JSON.stringify({
            isPlaying: state.currentFlow.isPlaying,
            stepIndex: state.currentFlow.stepIndex,
            currentStepTitle: state.currentFlow.activeStep?.title || null,
            currentStepText: refs.currentStepText.textContent,
            lastReplayTitle: state.currentFlow.lastReplayDescriptor?.title || null
          }))
        };
      },
      runTests: () => runSolverTests()
    };

    resetSolverState();
    resetMainControlSolverState();
    resetContinuousControlSolverState();
    resetJogControlSolverState();
    applyCalibrationQueryPreset();
    initializePlatformRuntime();
  </script>
</body>
</html>
